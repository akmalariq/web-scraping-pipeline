[project]
name = "web-scraping-pipeline"
version = "0.1.0"
description = "Production-style web scraping and ingestion pipeline: polite HTTP fetching, headless browser rendering, normalization, warehouse loading, orchestration, and monitoring."
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "playwright>=1.45",
    "duckdb>=1.1",
    "pyarrow>=17.0",
]

[project.optional-dependencies]
dagster = ["dagster>=1.9"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]

[project.scripts]
scrape = "scraper_pipeline.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scraper_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]
